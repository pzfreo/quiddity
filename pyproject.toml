[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quiddity"
version = "0.2.1"
description = "Deterministic, geometry-only feature recognition for build123d solids"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Paul Fremantle", email = "pzfreo@gmail.com" }]
requires-python = ">=3.10,<3.15"
dependencies = ["build123d>=0.9,<0.12"]
keywords = ["build123d", "cad", "brep", "feature-recognition", "step"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/pzfreo/quiddity"
Issues = "https://github.com/pzfreo/quiddity/issues"

[project.scripts]
quiddity = "quiddity.cli:main"
quiddity-capabilities = "quiddity.capabilities:main"

[dependency-groups]
dev = [
    # Test-only. The release workflow is validated by parsing it, not by matching substrings:
    # five review rounds of substring assertions each shipped a check that could be satisfied
    # by a comment or by another job, including one satisfied by a comment explaining an
    # earlier defect. Structure is what the assertions are actually about.
    "pyyaml>=6",
    "mypy>=1.15,<2",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.4.0",
    "ruff>=0.9",
    "pytest-xdist>=3.6,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quiddity"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/docs",
    "/migration",
    "/src",
    "/tests",
    "/tools",
    "/CONTRIBUTING.md",
    "/RELEASE_NOTES.md",
    "/uv.lock",
]
# Vendored third-party STEP corpora: 9 MB of NIST and MFCAD++ models that the tests read but
# that no consumer of the sdist needs. Measured, the sdist is 376 KB with this exclusion and
# 2.0 MB without -- 5.4x, not the twentyfold an earlier version of this comment claimed by
# comparing a gzipped artefact against uncompressed bytes. The tests themselves still ship,
# and skip when the corpus is absent.
exclude = ["/tests/corpus"]

[tool.pytest.ini_options]
# Keep the default command suitable for a fast targeted edit/test loop. The canonical Linux 3.12
# CI job owns whole-package branch coverage and its 91% gate; compatibility jobs exercise behavior
# without paying that instrumentation cost nine times.
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: expensive whole-inventory, corpus, transformation, packaging, or correspondence evidence",
]
# `tests` is a package (`tests/golden/__init__.py`), so a golden fixture's
# `from tests.golden._common import ...` needs the repo root importable. Without this it worked
# only when some earlier test in the session had already imported `tests` -- an order dependency
# that surfaced the moment a new test file changed collection order.
pythonpath = ["."]

[tool.coverage.report]
# coverage.py otherwise rounds to a whole percentage before applying a decimal threshold.
precision = 2

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/quiddity", "tests/typing/public_consumer.py"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "OCP.*"
ignore_missing_imports = true

# cadquery-ocp-novtk 7.9.3.1.1 is missing OCP.GccEnt. Keep this aligned with
# Draftwright until the upstream wheel is repaired.
[tool.uv]
constraint-dependencies = ["cadquery-ocp-novtk!=7.9.3.1.1"]
