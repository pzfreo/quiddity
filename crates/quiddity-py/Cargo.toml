[package]
name = "quiddity-py"
version = "0.4.9"
edition = "2024"
license = "Apache-2.0"
description = "Dependency-free Python bindings for quiddity's Rust STEP recognition engine"
repository = "https://github.com/pzfreo/quiddity"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
quiddity = { path = "../..", version = "=0.4.9", features = ["cli", "json-import"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde_json = "1.0.151"

# Linux extensions resolve Python symbols in the importing interpreter, not libpython.
[target.'cfg(target_os = "linux")'.dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
