[package]
name = "quiddity-py"
version = "0.4.8"
edition = "2024"
license = "Apache-2.0"
description = "Dependency-free Python bindings for quiddity's Rust STEP recognition engine"
repository = "https://github.com/pzfreo/quiddity"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
quiddity = { path = "../..", version = "=0.4.8", features = ["json-import"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde_json = "1.0.151"
