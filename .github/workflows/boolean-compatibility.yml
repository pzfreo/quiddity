name: Build123d boolean compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: boolean-compatibility-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  support:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build123d: ["0.9.1", "0.10.0", "0.11.1"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.10"
          enable-cache: true
      # Resolve a fresh dependency environment, not the normal lockfile's build123d 0.11.
      # Installing both old/new OCP distributions into one venv would invalidate this evidence.
      - name: Test installed provider with explicit build123d version
        run: >-
          uv run --isolated --no-project --python 3.10
          --with . --with 'build123d==${{ matrix.build123d }}'
          --with pytest --with pytest-timeout
          python -m pytest tests/test_boolean_support_compat.py
          tests/test_open_channel_section.py tests/test_corner_section.py
          tests/test_planar_outer_profiles.py -q
