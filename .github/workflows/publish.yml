name: Publish distributions

# Draftwright's publish workflow, ported. This package was relicensed from that repository and
# its release process had drifted into something else: distributions were built on a
# maintainer's machine, attached to the GitHub release, and promoted from there. The published
# wheel was therefore not a function of the tag -- the old workflow could only check that an
# attached artifact's *version* matched, which a wheel built from a dirty tree also satisfies.
#
# An earlier attempt at this port kept this package's TestPyPI-then-verify chain and added a
# release-notes gate, a tag-versus-branch check and an artifact verifier on top of
# Draftwright's four jobs. That superset, not the port, is where five rounds of review findings
# came from: a verifier comparing the tag against a version derived from that same tag, a guard
# added to compensate for it, and a PyPI leg that could be rewired to bypass the TestPyPI one.
# The extra chain was also buying something already bought -- every push to main publishes a
# dev snapshot to TestPyPI, so the publish path is exercised continuously rather than once per
# release.
#
# The one adaptation the port needs: this package keeps its version in seven files rather than
# three, which is what `scripts/update-recogniser-version` exists to move atomically.

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Main snapshots need no artifact hand-off: build and trusted publication share one runner.
  publish-testpypi:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/quiddity
    permissions:
      contents: read
      id-token: write # Trusted Publishing exchanges OIDC for a short-lived index token.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - name: Set TestPyPI dev version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          current=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          base="${current%.dev*}"
          scripts/update-recogniser-version "${base}.dev${RUN_NUMBER}"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # A real release retains the built artifact across the separately protected PyPI job.
  build-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - name: Strip dev suffix for real release
        run: |
          current=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          base="${current%.dev*}"
          scripts/update-recogniser-version "$base"
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build-release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quiddity
    permissions:
      id-token: write # Trusted Publishing exchanges OIDC for a short-lived index token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  bump-version:
    needs: publish-pypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write # Dispatch CI against the pushed branch; see below.
      contents: write # Push only the generated post-release branch.
      pull-requests: write # Open a PR rather than pushing to main directly.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # zizmor: ignore[artipacked] -- this job pushes; it uploads no artifacts.
        with:
          ref: main
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - name: Bump patch version with .dev0 suffix
        run: |
          current=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          base="${current%.dev*}"
          IFS='.' read -r major minor patch <<< "$base"
          scripts/update-recogniser-version "${major}.${minor}.$((patch + 1)).dev0"
      - name: Open the branch-protection-safe post-release bump
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          new_version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          branch="automation/post-release-${RELEASE_TAG}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -am "Bump version to ${new_version} after ${RELEASE_TAG}"
          git push origin HEAD:"$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump version to ${new_version} after ${RELEASE_TAG}" \
            --body "Post-release development-version bump. Publication already succeeded for \`${RELEASE_TAG}\`; this changes only build and lock identity."
          # A branch pushed with GITHUB_TOKEN raises no events, so dispatch the CI status
          # explicitly.
          gh workflow run ci.yml --ref "$branch"
