# Developer Certificate of Origin: every commit in a pull request from a fork carries a
# Signed-off-by line (`git commit -s`). See CONTRIBUTING.md.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The PR's own commits: not on the base, nor on a newer base the branch has merged in.
          missing=""
          for c in $(git rev-list --no-merges "$HEAD" --not "$BASE" "origin/$BASE_REF"); do
            # A sign-off is a Signed-off-by trailer with a name and an email.
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" \
                | grep -Eq '^[^<>]*[^<> ][^<>]* <[^<>@ ]+@[^<> ]+>$'; then
              missing="$missing$(git log -1 --format='%h %s' "$c")
          "
            fi
          done
          if [ -n "$missing" ]; then
            echo "These commits have no Signed-off-by line with a name and email. Sign off with 'git commit -s' (see CONTRIBUTING.md):"
            printf '%s' "$missing"
            exit 1
          fi
          echo "Every commit is signed off."
