name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    # A pull request that changes only documentation skips this workflow. Pushes to main and
    # manual runs still run everything. The DCO check and the crates.io and Python workflows
    # keep their own path filters (a README edit still runs the packaging checks).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

# New PR commits and full-ci label changes supersede the previous PR run. Main pushes,
# dispatches and unrelated label events each get their own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'full-ci') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Ready PRs run the Linux fast tier. Main pushes, manual runs, release* PRs and the
# full-ci label select the full suite on both platforms. Drafts run lint and DCO.
jobs:
  setup:
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.tier.outputs.full }}
    steps:
      - id: tier
        env:
          FULL: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: echo "full=$FULL" >> "$GITHUB_OUTPUT"

  advisories:
    needs: setup
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file Cargo.lock

  # The library as browser builds use it: no command line, no assembly scan (no tempfile or mmap),
  # for wasm32-unknown-unknown. Draftwright's and Specify's WASM engines depend on this.
  wasm:
    needs: setup
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32
      - run: cargo build -p haecceity --release --locked --target wasm32-unknown-unknown --no-default-features --features presentation,json
      - run: cargo build -p quiddity --lib --release --locked --target wasm32-unknown-unknown --no-default-features --features presentation,json

  lint:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.full == 'true' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The toolchain comes from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A draft runs fmt and the lints (clippy, feature checks) only; tests wait for ready.
      - run: python3 -m unittest discover -s .github -p 'test_*.py'
        if: github.event.pull_request.draft != true
      - run: python3 -I tools/as_compare/test_score.py
        if: github.event.pull_request.draft != true
      - run: python3 -I tools/as_compare/test_score_mfcadpp.py
        if: github.event.pull_request.draft != true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      # Keep optional Fusion coverage on the existing Linux runner, without another archive
      # or shard build. cadmpeg's release code generation is too costly to repeat in CI.
      # Local first feature check: 2.7 minutes at load ~55; budget ~3 added Linux minutes.
      - run: cargo check --workspace --all-targets --release --locked --features f3d
        if: runner.os == 'Linux'
      # One serial Linux binary exercises feature-off goldens and removal, without a
      # second matrix, archive or shard build. Reuse this runner's release dependencies.
      - run: cargo test -p haecceity --release --locked --no-default-features --test pmi_write
        if: runner.os == 'Linux' && github.event.pull_request.draft != true
      # The library without the command line (and clap), as specify-core's WASM build uses it.
      - run: cargo check -p quiddity --release --locked --no-default-features --features presentation
        if: runner.os == 'Linux'
      # Strict STEP -> PartPmi -> JSON -> PartPmi -> STEP, with no corpus scan.
      # The workspace archive unifies json-import through quiddity-py (including
      # the source-presentation binary); keep this strict NIST gate explicit.
      - run: cargo test -p haecceity --release --locked --features json-import --test pmi_json_roundtrip nist_roundtrip -- --exact
        if: runner.os == 'Linux' && github.event.pull_request.draft != true
      # nextest does not run doc-tests.
      - run: cargo test --doc --workspace --release --locked
        if: github.event.pull_request.draft != true

  linux:
    needs: setup
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/suite.yml
    with:
      os: ubuntu-latest
      tier: ${{ needs.setup.outputs.full == 'true' && 'ci' || 'pr' }}

  macos:
    needs: setup
    if: needs.setup.outputs.full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/suite.yml
    with:
      os: macos-latest
