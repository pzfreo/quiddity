name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A branch pushed by a workflow using GITHUB_TOKEN raises no `push` or `pull_request` event, so
  # the post-release bump PR would carry no checks at all. `publish.yml` dispatches this workflow
  # against that branch instead.
  workflow_dispatch:

# A PR receives the representative compatibility matrix. Its merge commit receives one canonical
# Linux/3.12 run rather than immediately repeating every platform/version combination. The separate
# full-matrix workflow retains scheduled and manually requested exhaustive evidence.
concurrency:
  group: package-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --dev
      # `scripts/update-recogniser-version` is named explicitly: ruff discovers *.py,
      # and an extensionless executable would otherwise be linted by nothing.
      - run: uv run ruff check . scripts/update-recogniser-version
      - run: uv run ruff format --check . scripts/update-recogniser-version
      - run: uv run mypy

  fast-test:
    name: fast test (ubuntu-latest, 3.12)
    # This is early PR feedback. Main and explicit dispatches already run the complete suite.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: Run the fast edit/test tier
        run: uv run pytest -n 2 -m "not slow"

  test:
    name: test (ubuntu-latest, 3.12)
    # Draft iterations get the fast tier. Marking the PR ready, every later ready-PR update, main,
    # and the post-release dispatch run the complete suite and authoritative coverage gate.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      id-token: write # Authenticate the one canonical Codecov upload without a secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: Test with authoritative branch coverage
        run: >-
          uv run pytest
          --cov=quiddity
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=91
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          fail_ci_if_error: true
          files: coverage.xml
          flags: unittests
          use_oidc: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-ubuntu-latest-3.12
          path: coverage.xml
          if-no-files-found: error

  compatibility:
    # Pull requests and the explicitly dispatched post-release bump get representative platform
    # and Python-boundary evidence. A main push has already passed this matrix on its PR.
    if: github.event_name != 'push'
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --dev
      - name: Test compatibility without coverage instrumentation
        run: uv run pytest -n 2 -m "not slow"
